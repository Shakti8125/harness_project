# Fly.io app config. NOT deployed by Phase 0 — `fly launch`/`fly deploy` and
# `fly secrets set` for HARNESS_GEMINI_API_KEY / HARNESS_GITHUB_TOKEN /
# HARNESS_GITHUB_WEBHOOK_SECRET are Phase 1 work. This file only pins the shape.

app = "agent-harness"
primary_region = "iad"

[build]

[env]
  HARNESS_DATABASE_PATH = "/data/harness.db"
  HARNESS_GATEWAY = "replay"
  HARNESS_DRY_RUN = "true"
  HARNESS_ENV = "prod"
  HARNESS_LOG_LEVEL = "INFO"

[[mounts]]
  source = "harness_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
