[project]
name = "harness"
version = "0.1.0"
description = "Agent Harness — domain-agnostic multi-agent control plane, CI/CD triage as first integration"
requires-python = "==3.12.*"
dependencies = [
    "pydantic>=2",
    "pydantic-settings",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "aiosqlite",
    "google-genai",
    "jinja2",
    "pyyaml",
]

[dependency-groups]
# mypy is floored, and only mypy: our gate depends on its *inference*, not just its exit
# code, and inference changes across versions in ways that flip results on unchanged code
# (see the divergence below). ruff and pytest report against a fixed rule set / fixed test
# collection respectively — a version bump can add new lint rules or plugin behaviour, but
# it does not reinterpret code that already passed as newly wrong the way mypy's narrowing
# did here. So the same argument doesn't reach them; pinning them "for symmetry" would be
# reflexive, not principled.
#
# Floor is 1.18.2: a bare-PATH mypy 1.14.1 reported a spurious `arg-type` at
# orchestrator.py:312 (Mapping.get narrowing) that uv.lock's pinned 2.3.1 does not; the fix
# landed upstream between those two versions. uv.lock already resolves to 2.3.1, so this
# floor does not change what gets installed — it only stops a bare/unpinned mypy invocation
# from silently regressing to the broken behaviour. See docs/progress/phase-1/review-2.md
# and docs/progress/phase-1/test-verifier.md for the incident.
dev = [
    "ruff",
    "mypy>=1.18.2",
    "pytest",
    "pytest-asyncio",
    "respx",
    "freezegun",
    "types-pyyaml",
]

# This project is an application, not a library: nothing under src/ is meant to be
# built into a wheel or installed into site-packages. uv therefore treats it as a
# "virtual" (non-package) project — it manages the dependency set in .venv only.
# Imports resolve via `pythonpath = ["."]` below (pytest) and via uvicorn/uv run
# inserting the current working directory on sys.path at runtime. This also means
# `uv sync` never needs src/harness or src/integrations to exist yet, which matters
# while those trees are being built by other agents in parallel.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "."
namespace_packages = true
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
ignore_missing_imports = true

# PLAN.md line 282: strict mode applies to src/harness only. The rest of the tree
# (api/, integrations/, settings.py) is typed but not held to --strict.
# Wave-3 audit cleanup (test-verifier): "harness.*" was dead weight — every module in
# this repo is imported as "src.harness.*", never bare "harness.*", so mypy warned
# `unused section(s): module = ['harness.*']`. "src.harness.*" alone does the work.
[[tool.mypy.overrides]]
module = ["src.harness.*"]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
