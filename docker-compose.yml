services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: harness:local
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      HARNESS_DATABASE_PATH: /app/data/harness.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
